[package]
name = "rshgf"
version = "0.3.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rshgf"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"    # The source file of the target.

[build-dependencies]
# Used by build.rs to add the macOS extension-module link arguments.
pyo3-build-config = "0.28.1"

[dependencies]
pyo3 = { version = "0.28.1", features = ["extension-module", "abi3-py312"] }
numpy = "0.28"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
ndarray = { version = "0.16", features = ["matrixmultiply-threading", "rayon"] }
rayon = "1.10"

# BLAS provider, linked only under the `blas` feature, with a per-platform
# backend: the system Accelerate framework on Apple targets (no build step),
# OpenBLAS elsewhere (requires an OpenBLAS toolchain).
[target.'cfg(target_vendor = "apple")'.dependencies]
blas-src = { version = "0.10", optional = true, features = ["accelerate"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
blas-src = { version = "0.10", optional = true, features = ["openblas"] }

[features]
# The default build of the vectorised backend (`DeepNetwork`) computes in f32
# through the pure-Rust `matrixmultiply` kernel — no BLAS toolchain required.
# Two opt-in features adjust the engine:
#
#   maturin develop --release                    # f32, pure Rust (default)
#   maturin develop --release -F blas            # f32 + linked BLAS (SGEMM)
#   maturin develop --release -F f64             # the previous engine (f64)
#   maturin develop --release -F f64 -F blas     # f64 + linked BLAS (DGEMM)
#
# The nodalised (per-node) backend computes in f64 under every configuration.

# Route ndarray's `.dot()` through a linked BLAS (SGEMM/DGEMM) instead of the
# pure-Rust `matrixmultiply` kernel. Pays off at wide layers and batched gemm.
blas = ["ndarray/blas", "dep:blas-src"]

# Compute the vectorised backend in f64 instead of the default f32.
f64 = []
