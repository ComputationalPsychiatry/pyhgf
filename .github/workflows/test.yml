name: Test

on:
  push:
    branches:
      - master
  pull_request:
    # This will run the action for pull requests from any branch
    branches:
      - '*'
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every Python version finish so a failure shows which versions are affected.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install UV
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          # add uv to PATH
          export PATH="$HOME/.local/bin:$PATH"
          uv venv .venv   # create a uv-managed virtualenv

      # Step 4: Install System Dependencies
      # `plot_network` calls `unflatten`, which Ubuntu 24.04 ships in graphviz and
      # Debian-based releases from Ubuntu 26.04 ship in graphviz-tools.
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          if apt-cache show graphviz-tools > /dev/null 2>&1; then
            sudo apt-get install -y graphviz-tools
          fi
          command -v dot
          command -v unflatten

      # Step 5: Install Rust
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      # Step 6: Cache the compiled Rust dependencies
      # The key includes the Python version because pyo3 rebuilds when the interpreter
      # changes, so a cache shared across the matrix would be invalidated on every job.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}

      # Step 7: Install Python Dependencies using Poetry
      - name: Install dependencies
        run: |
          uv sync --dev

      # Step 8: Install the Rust package
      - name: Build and Install the Package
        run: uv run maturin develop --release

      # Step 9: Run Tests and Generate Coverage Report
      # NOTE: `pyhgf/` is listed alongside `./tests/` so that `--doctest-modules`
      # collects the `Examples` sections of the docstrings. The flag applies to the
      # whole invocation, so it only reaches the package when the package is a target.
      - name: Run tests and coverage
        run: |
          uv run pytest ./tests/ pyhgf/ --doctest-modules --cov=./pyhgf/ --cov-report=xml --cov-branch

      # Steps 10 to 12 run on a single Python version: the benchmark artifact name
      # must be unique within a run, and one coverage report is enough.

      # Step 10: Upload Coverage Report to Codecov
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Step 11: Run pytest-benchmark
      - name: Run pytest-benchmark
        if: matrix.python-version == '3.12'
        run: |
          uv run pytest --benchmark-only --benchmark-json=.benchmarks/new_benchmark.json

      # Step 12: Upload benchmark artifact
      - name: Upload baseline benchmark
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-benchmark
          path: .benchmarks/new_benchmark.json
